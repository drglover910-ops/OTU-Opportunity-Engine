name: Sync assistant development requests
on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - docs/assistant_bridge/replies/**
permissions:
  contents: write
concurrency:
  group: otu-assistant-bridge
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read approved requests and return developer replies
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_assistant_bridge.py
      - name: Save reviewed requests in private repository
        run: |
          git config user.name 'OTU assistant bridge'
          git config user.email 'otu-assistant@users.noreply.github.com'
          git add docs/assistant_bridge/requests.json
          if ! git diff --cached --quiet; then
            git commit -m 'Receive owner-reviewed assistant development requests'
            git pull --rebase origin work
            git push origin HEAD:work
          fi
      - name: Return repository receipts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_assistant_bridge.py --ack
