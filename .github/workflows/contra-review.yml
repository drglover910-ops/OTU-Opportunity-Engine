name: Prepare private Contra review materials
on:
  push:
    branches: [work]
    paths: [scripts/prepare_contra_review.py, .github/workflows/contra-review.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: otu-contra-private-review
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private review only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/prepare_contra_review.py
      - name: Record preparation checks without private files
        run: |
          git config user.name 'OTU review preparation'
          git config user.email 'otu-review@users.noreply.github.com'
          git add docs/CONTRA_REVIEW_PREPARATION.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record unsent Contra review-material preparation'
          git pull --rebase origin work
          git push origin HEAD:work
