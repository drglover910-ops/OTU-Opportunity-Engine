name: Deploy private Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [main, work]
    paths:
      - app.py
      - Dockerfile
      - README.md
      - VERSION
      - CHANGELOG.md
      - scripts/deploy_space.py
      - .github/workflows/deploy-space.yml
permissions:
  contents: read
concurrency:
  group: otu-hugging-face-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate app
        run: python -m unittest discover -s tests
      - name: Install deployment client
        run: python -m pip install huggingface_hub==0.36.0
      - name: Update existing private Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py
