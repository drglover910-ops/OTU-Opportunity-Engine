name: Study authorized sent outreach
on:
  push:
    branches: [work]
    paths: [scripts/mail_study.py, .github/workflows/mail-study.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/mail_study.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Record redacted analysis; keep full emails in private app storage
        run: |
          git config user.name 'OTU mail study'
          git config user.email 'otu-study@users.noreply.github.com'
          git add docs/MAIL_STUDY_SUMMARY.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record redacted outreach patterns and conversation progress'
          git pull --rebase origin work
          git push origin HEAD:work
