name: Research official platform docs
on:
  push:
    branches: [work]
    paths: [scripts/research_platforms.py, .github/workflows/research.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==0.36.0
      - run: python scripts/research_platforms.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Save research back to development branch
        run: |
          git config user.name 'OTU research workflow'
          git config user.email 'otu-research@users.noreply.github.com'
          git add docs/RESEARCH_RESULTS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record official platform research and connection status'
          git pull --rebase origin work
          git push origin HEAD:work
